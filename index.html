<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6366f1" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Notes" />
<title>Notes</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous" />
<style>
  :root {
    --bg: #f6f7fb; --bg2: #eef0f7; --fg: #15171c; --muted: #6b7280;
    --line: #e6e8ef; --card: #ffffff; --card-hover: #fbfbff;
    --accent: #6366f1; --accent2: #8b5cf6; --accent-fg: #ffffff; --danger: #dc2626;
    --shadow: 0 1px 2px rgba(20,22,40,.04), 0 4px 16px rgba(20,22,40,.06);
    --shadow-lg: 0 10px 30px rgba(40,30,120,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0e13; --bg2: #11141b; --fg: #e9eaef; --muted: #8b91a0;
      --line: #232734; --card: #161922; --card-hover: #1b1f2a;
      --accent: #818cf8; --accent2: #a78bfa; --accent-fg: #0c0e13; --danger: #f87171;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.35);
      --shadow-lg: 0 10px 34px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 100% -10%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 60%),
      radial-gradient(1000px 500px at -10% 0%, color-mix(in srgb, var(--accent2) 8%, transparent), transparent 55%),
      linear-gradient(180deg, var(--bg), var(--bg2));
    background-attachment: fixed;
    color: var(--fg);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 6px; padding: 11px 16px;
    padding-top: calc(11px + env(safe-area-inset-top));
  }
  .brand { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; }
  .brand .dot {
    width: 22px; height: 22px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  header h1 { font-size: 19px; margin: 0; font-weight: 750; letter-spacing: -.02em; }
  header .spacer { flex: 1; }
  .icon-btn {
    background: none; border: none; color: var(--muted); font-size: 19px;
    width: 38px; height: 38px; cursor: pointer; border-radius: 10px; line-height: 1;
    display: grid; place-items: center; transition: background .15s, color .15s;
  }
  .icon-btn:hover { color: var(--fg); background: var(--card); }
  .icon-btn:active { transform: scale(.92); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; animation: fade .22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  input, textarea, button { font: inherit; color: inherit; }

  .search-wrap { position: relative; margin-bottom: 18px; }
  .search-wrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search {
    width: 100%; padding: 12px 14px 12px 40px; border: 1px solid var(--line);
    border-radius: 13px; background: var(--card); box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s;
  }
  .search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent); }

  .section-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 18px 4px 9px;
  }
  .section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .section-label .count {
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
    padding: 1px 7px; border-radius: 999px; font-size: 10px; letter-spacing: .02em;
  }

  .note-item {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 14px; margin-bottom: 9px; cursor: pointer; box-shadow: var(--shadow);
    transition: transform .12s, border-color .15s, background .15s;
  }
  .note-item:hover { background: var(--card-hover); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); transform: translateY(-1px); }
  .note-item:active { transform: translateY(0) scale(.995); }
  .note-item .glyph {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 10px;
    display: grid; place-items: center; font-size: 17px;
    background: color-mix(in srgb, var(--pill, var(--accent)) 16%, var(--card));
    color: var(--pill, var(--accent));
  }
  .note-item .body { min-width: 0; flex: 1; }
  .note-item .title { font-weight: 620; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-item .sub { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .note-item .chev { color: var(--muted); flex: 0 0 auto; opacity: .6; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
    padding: 2px 9px; border-radius: 999px;
    background: color-mix(in srgb, var(--pill, var(--accent)) 15%, transparent);
    color: var(--pill, var(--accent));
  }

  .fab {
    position: fixed; right: 20px; bottom: calc(22px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 19px; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-size: 30px; box-shadow: var(--shadow-lg); cursor: pointer; z-index: 20;
    display: grid; place-items: center; transition: transform .14s, box-shadow .14s;
  }
  .fab:hover { transform: translateY(-2px); }
  .fab:active { transform: scale(.94); }

  .btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none;
    padding: 10px 18px; border-radius: 11px; cursor: pointer; font-weight: 650; letter-spacing: -.01em;
    box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 30%, transparent); transition: transform .12s, opacity .15s;
  }
  .btn:hover { opacity: .94; } .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.secondary { background: var(--card); color: var(--fg); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .btn.danger { background: var(--card); color: var(--danger); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }

  .field { display: block; margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--card); box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent); }

  textarea.editor {
    width: 100%; min-height: 58vh; padding: 14px; border: 1px solid var(--line);
    border-radius: 13px; background: var(--card); resize: vertical; box-shadow: var(--shadow);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; line-height: 1.6;
  }
  textarea.editor:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 12%, transparent); }

  .card-pane { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 20px 22px; }
  .md { word-wrap: break-word; }
  .md > :first-child { margin-top: 0; }
  .md h1,.md h2,.md h3 { line-height: 1.25; letter-spacing: -.02em; }
  .md h1 { font-size: 1.7em; } .md h2 { font-size: 1.35em; padding-bottom: .25em; border-bottom: 1px solid var(--line); }
  .md a { color: var(--accent); }
  .md pre { background: var(--bg2); padding: 14px; border-radius: 11px; overflow: auto; border: 1px solid var(--line); }
  .md code { background: var(--bg2); padding: 2px 6px; border-radius: 6px; font-size: .88em; }
  .md pre code { padding: 0; background: none; }
  .md blockquote { border-left: 3px solid var(--accent); margin: 1em 0; padding: .2em 0 .2em 14px; color: var(--muted); }
  .md table { border-collapse: collapse; width: 100%; }
  .md th, .md td { border: 1px solid var(--line); padding: 7px 11px; }
  .md th { background: var(--bg2); }
  .md img { max-width: 100%; border-radius: 10px; }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 1.6em 0; }

  .muted { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty .big { font-size: 34px; margin-bottom: 10px; opacity: .7; }
  .crumb {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); font-size: 12.5px; margin-bottom: 12px; word-break: break-all;
    background: var(--card); border: 1px solid var(--line); padding: 5px 11px; border-radius: 999px;
  }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%) translateY(8px);
    bottom: calc(26px + env(safe-area-inset-bottom));
    background: var(--fg); color: var(--bg); padding: 11px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 550; z-index: 50; opacity: 0; box-shadow: var(--shadow-lg);
    transition: opacity .2s, transform .2s; pointer-events: none; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .skeleton { background: var(--card); border: 1px solid var(--line); border-radius: 14px; height: 64px; margin-bottom: 9px; position: relative; overflow: hidden; box-shadow: var(--shadow); }
  .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--fg) 6%, transparent), transparent);
    animation: shimmer 1.3s infinite; }
  @keyframes shimmer { to { transform: translateX(100%); } }

  .today {
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 13%, var(--card)), var(--card));
    border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
    border-radius: 16px; padding: 14px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .today-head { display: flex; align-items: center; gap: 11px; }
  .today-head .t-icon {
    width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-size: 19px;
    background: color-mix(in srgb, var(--accent) 18%, var(--card));
  }
  .today-head .t-title { font-weight: 700; letter-spacing: -.01em; }
  .today-head .t-date { color: var(--muted); font-size: 12.5px; }
  .today-head .t-open { margin-left: auto; }
  .t-add { display: flex; gap: 8px; margin-top: 12px; }
  .t-add input {
    flex: 1; min-width: 0; padding: 10px 13px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--bg); transition: border-color .15s, box-shadow .15s;
  }
  .t-add input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 12%, transparent); }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="dot"></div><h1>Notes</h1></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="remindersBtn" title="Reminders">🔔</button>
  <button class="icon-btn" id="refreshBtn" title="Refresh">⟳</button>
  <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<script>
// ---------- config ----------
const LS = {
  get token() { return localStorage.getItem('gh_token') || ''; },
  set token(v) { localStorage.setItem('gh_token', v); },
  get owner() { return localStorage.getItem('gh_owner') || 'marc-harary-bronco'; },
  set owner(v) { localStorage.setItem('gh_owner', v); },
  get repo() { return localStorage.getItem('gh_repo') || 'notes'; },
  set repo(v) { localStorage.setItem('gh_repo', v); },
  get branch() { return localStorage.getItem('gh_branch') || 'main'; },
  set branch(v) { localStorage.setItem('gh_branch', v); },
  get api() { return localStorage.getItem('rem_api') || ''; },
  set api(v) { localStorage.setItem('rem_api', v); },
  get apiSecret() { return localStorage.getItem('rem_secret') || ''; },
  set apiSecret(v) { localStorage.setItem('rem_secret', v); },
};

const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
let TREE = [];
let toastTimer = null;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

// ---------- base64 (utf-8 safe) ----------
function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64decode(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

// ---------- github api ----------
async function gh(path, opts = {}) {
  if (!LS.token) throw new Error('No token set — open Settings (⚙) and paste a GitHub token.');
  const res = await fetch('https://api.github.com' + path, {
    ...opts,
    headers: {
      'Authorization': 'Bearer ' + LS.token,
      'Accept': 'application/vnd.github+json',
      ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) {
    let detail = res.status + ' ' + res.statusText;
    try { const j = await res.json(); if (j.message) detail += ' — ' + j.message; } catch {}
    throw new Error(detail);
  }
  if (res.status === 204) return null;
  return res.json();
}
const repoBase = () => `/repos/${LS.owner}/${LS.repo}`;
const encPath = p => p.split('/').map(encodeURIComponent).join('/');

async function fetchTree() {
  const data = await gh(`${repoBase()}/git/trees/${encodeURIComponent(LS.branch)}?recursive=1`);
  TREE = (data.tree || [])
    .filter(n => n.type === 'blob' && n.path.toLowerCase().endsWith('.md'))
    .map(n => ({ path: n.path, sha: n.sha }));
  TREE.sort((a, b) => {
    const ai = /^(inbox|daily)\//.test(a.path), bi = /^(inbox|daily)\//.test(b.path);
    if (ai && bi) return b.path.localeCompare(a.path);
    if (ai) return -1; if (bi) return 1;
    return a.path.localeCompare(b.path);
  });
  return TREE;
}
async function getFile(path) {
  const data = await gh(`${repoBase()}/contents/${encPath(path)}?ref=${encodeURIComponent(LS.branch)}`);
  return { content: b64decode(data.content), sha: data.sha };
}
async function putFile(path, content, sha, message) {
  const body = { message: message || ('update ' + path), content: b64encode(content), branch: LS.branch };
  if (sha) body.sha = sha;
  return gh(`${repoBase()}/contents/${encPath(path)}`, { method: 'PUT', body: JSON.stringify(body) });
}
async function deleteFile(path, sha, message) {
  return gh(`${repoBase()}/contents/${encPath(path)}`, {
    method: 'DELETE', body: JSON.stringify({ message: message || ('delete ' + path), sha, branch: LS.branch }),
  });
}

// ---------- reminders backend ----------
async function api(path, opts = {}) {
  if (!LS.api || !LS.apiSecret) throw new Error('Reminders backend not set up — open Settings (⚙).');
  const res = await fetch(LS.api.replace(/\/+$/, '') + path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + LS.apiSecret, ...(opts.body ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers || {}) },
  });
  if (!res.ok) { let d = res.status + ' ' + res.statusText; try { const j = await res.json(); if (j.error) d += ' — ' + j.error; } catch {} throw new Error(d); }
  return res.status === 204 ? null : res.json();
}
function urlB64ToBytes(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const s = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(s); const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
async function enableNotifications() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window))
    throw new Error('Push not available here. On iPhone: add the app to your Home Screen and open it from there first.');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('Permission denied.');
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    const { publicKey } = await api('/vapidPublicKey');
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToBytes(publicKey) });
  }
  await api('/subscribe', { method: 'POST', body: JSON.stringify({ subscription: sub.toJSON ? sub.toJSON() : sub }) });
}

// ---------- helpers ----------
function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
const todayISO = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const nowHM = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${p(d.getHours())}:${p(d.getMinutes())}`; };
const todayPath = () => `daily/${todayISO()}.md`;
const prettyToday = () => new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
async function ensureToday() {
  try { return await getFile(todayPath()); }
  catch (e) {
    if (!/404|Not Found/i.test(e.message)) throw e;
    await putFile(todayPath(), `# ${todayISO()}\n\n`, null, `daily: ${todayISO()}`);
    return getFile(todayPath());
  }
}
async function appendToday(text) {
  let content = '', sha = null;
  try { const f = await getFile(todayPath()); content = f.content; sha = f.sha; }
  catch (e) { if (!/404|Not Found/i.test(e.message)) throw e; }
  if (!content.trim()) content = `# ${todayISO()}\n\n`;
  if (!content.endsWith('\n')) content += '\n';
  const t = nowHM();
  content += `- ${t} — ${text}\n`;
  await putFile(todayPath(), content, sha, `daily: ${todayISO()} ${t}`);
}
const titleOf = path => path.split('/').pop().replace(/\.md$/i, '');
const topDir = path => { const i = path.indexOf('/'); return i === -1 ? '' : path.slice(0, i); };
const subDir = path => { // dir between top and file, e.g. research/ideas/x.md -> "ideas"
  const parts = path.split('/'); parts.pop();
  return parts.slice(1).join('/');
};
function hueFor(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
const GLYPHS = { inbox: '📥', daily: '📅', research: '🔬', work: '🛠️', ideas: '💡', reading: '📖', scratch: '✏️', '': '📄' };
const glyphFor = name => GLYPHS[name] || '📁';
const SECTION_ORDER = ['inbox', 'daily', 'research', 'work'];
const prettyDir = name => name === '' ? 'Top level' : name;

function renderMarkdown(el, text) {
  el.innerHTML = marked.parse(text || '');
  if (window.renderMathInElement) {
    try {
      renderMathInElement(el, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false },
          { left: '\\[', right: '\\]', display: true },
        ], throwOnError: false,
      });
    } catch {}
  }
}

// ---------- views ----------
async function viewList() {
  if (!LS.token) return viewSettings(true);
  app.innerHTML = `
    <div class="today">
      <div class="today-head">
        <span class="t-icon">📅</span>
        <div><div class="t-title">Today's log</div><div class="t-date">${escapeHtml(prettyToday())}</div></div>
        <button class="btn secondary t-open" id="openToday">Open ›</button>
      </div>
      <div class="t-add">
        <input id="todayInput" placeholder="Summarize something from today…" autocomplete="off" />
        <button class="btn" id="todayAdd">Add</button>
      </div>
    </div>
    <div class="search-wrap">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="search" id="search" placeholder="Search notes…" autocomplete="off" />
    </div>
    <div id="list">${'<div class="skeleton"></div>'.repeat(4)}</div>`;
  const listEl = document.getElementById('list');
  const search = document.getElementById('search');
  try { await fetchTree(); }
  catch (e) { listEl.innerHTML = `<div class="empty"><div class="big">⚠️</div>Couldn't load notes.<br><span class="muted">${escapeHtml(e.message)}</span></div>`; return; }

  function paint(filter = '') {
    const f = filter.trim().toLowerCase();
    const items = TREE.filter(n => !f || n.path.toLowerCase().includes(f));
    if (!items.length) {
      listEl.innerHTML = `<div class="empty"><div class="big">${f ? '🔍' : '🗒️'}</div>${f ? 'No notes match.' : 'No notes yet. Tap + to add one.'}</div>`;
      return;
    }
    // group by top-level folder
    const groups = {};
    for (const n of items) (groups[topDir(n.path)] ||= []).push(n);
    const keys = Object.keys(groups).sort((a, b) => {
      const ia = SECTION_ORDER.indexOf(a), ib = SECTION_ORDER.indexOf(b);
      if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      if (a === '') return 1; if (b === '') return -1;
      return a.localeCompare(b);
    });
    listEl.innerHTML = keys.map(k => {
      const hue = k === '' ? 230 : hueFor(k);
      const rows = groups[k].map(n => {
        const sd = subDir(n.path);
        return `<button class="note-item" style="--pill:hsl(${hue} 70% 55%)" data-path="${escapeAttr(n.path)}">
          <span class="glyph">${glyphFor(k)}</span>
          <span class="body">
            <span class="title">${escapeHtml(titleOf(n.path))}</span>
            ${sd ? `<span class="sub">${escapeHtml(sd)}</span>` : ''}
          </span>
          <span class="chev">›</span>
        </button>`;
      }).join('');
      return `<div class="section-label" style="color:hsl(${hue} 45% 50%)">${escapeHtml(prettyDir(k))}<span class="count">${groups[k].length}</span></div>${rows}`;
    }).join('');
    listEl.querySelectorAll('.note-item').forEach(b => b.onclick = () => viewNote(b.dataset.path));
  }
  paint();
  search.oninput = () => paint(search.value);

  // Today's log wiring
  document.getElementById('openToday').onclick = async () => {
    try { await ensureToday(); viewNote(todayPath()); }
    catch (e) { toast('Error: ' + e.message); }
  };
  const ti = document.getElementById('todayInput');
  const tadd = document.getElementById('todayAdd');
  async function addTodayLine() {
    const v = ti.value.trim();
    if (!v) return;
    tadd.disabled = true; ti.disabled = true;
    try {
      await appendToday(v);
      ti.value = ''; toast('Added to today');
      await fetchTree().catch(() => {});
      paint(search.value);
    } catch (e) { toast('Error: ' + e.message); }
    finally { tadd.disabled = false; ti.disabled = false; ti.focus(); }
  }
  tadd.onclick = addTodayLine;
  ti.onkeydown = e => { if (e.key === 'Enter') addTodayLine(); };

  let fab = document.querySelector('.fab');
  if (!fab) { fab = document.createElement('button'); fab.className = 'fab'; fab.textContent = '+'; document.body.appendChild(fab); }
  fab.style.display = ''; fab.onclick = () => viewEdit(null);
}

async function viewNote(path) {
  hideFab();
  const hue = hueFor(topDir(path) || 'root');
  app.innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <button class="btn secondary" id="back">← Back</button>
      <div class="row">
        <button class="btn secondary" id="edit">Edit</button>
        <button class="btn danger" id="del">Delete</button>
      </div>
    </div>
    <div class="crumb">${escapeHtml(path)}</div>
    <div class="card-pane"><div class="md" id="body"><div class="empty"><div class="big">⏳</div>Loading…</div></div></div>`;
  document.getElementById('back').onclick = viewList;
  let file;
  try { file = await getFile(path); }
  catch (e) { document.getElementById('body').innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`; return; }
  renderMarkdown(document.getElementById('body'), file.content);
  document.getElementById('edit').onclick = () => viewEdit({ path, content: file.content, sha: file.sha });
  document.getElementById('del').onclick = async () => {
    if (!confirm('Delete ' + path + '?')) return;
    try { await deleteFile(path, file.sha); toast('Deleted'); viewList(); }
    catch (e) { toast('Error: ' + e.message); }
  };
}

function viewEdit(existing) {
  hideFab();
  const isNew = !existing;
  const path = isNew ? `inbox/${stamp()}.md` : existing.path;
  app.innerHTML = `
    <div class="field"><label>Path</label>
      <input id="path" value="${escapeAttr(path)}" ${isNew ? '' : 'readonly'} /></div>
    <textarea class="editor" id="content" placeholder="Write markdown…  (math: $\\alpha$ or $$ … $$)">${isNew ? '' : escapeHtml(existing.content)}</textarea>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="save">Save</button>
      <button class="btn secondary" id="cancel">Cancel</button>
    </div>`;
  const ta = document.getElementById('content');
  if (isNew) setTimeout(() => ta.focus(), 50);
  document.getElementById('cancel').onclick = () => isNew ? viewList() : viewNote(existing.path);
  document.getElementById('save').onclick = async () => {
    const p = document.getElementById('path').value.trim();
    const c = ta.value;
    if (!p) return toast('Path required');
    const btn = document.getElementById('save');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await putFile(p, c, isNew ? null : existing.sha, (isNew ? 'add ' : 'update ') + p);
      toast('Saved'); await fetchTree().catch(() => {}); viewNote(p);
    } catch (e) { btn.disabled = false; btn.textContent = 'Save'; toast('Error: ' + e.message); }
  };
}

async function viewReminders() {
  hideFab();
  if (!LS.api || !LS.apiSecret) { toast('Set up the reminders backend in Settings first'); return viewSettings(false); }
  const granted = (typeof Notification !== 'undefined' && Notification.permission === 'granted');
  app.innerHTML = `
    <div class="row" style="margin-bottom:14px"><button class="btn secondary" id="back">← Back</button></div>
    ${granted ? '' : `<div class="card-pane" style="margin-bottom:14px">
      <b>Turn on notifications</b>
      <div class="muted" style="font-size:13.5px;margin:5px 0 11px">On iPhone, add this app to your Home Screen and open it from there, then tap below.</div>
      <button class="btn" id="enable">Enable notifications</button></div>`}
    <div class="card-pane" style="margin-bottom:16px">
      <div class="field"><label>Reminder</label><input id="rtext" placeholder="e.g. Submit the DV report" /></div>
      <div class="field"><label>When</label><input id="rwhen" type="datetime-local" /></div>
      <div class="row"><button class="btn" id="add">Add reminder</button>
        <button class="btn secondary" id="test">Send test</button></div>
    </div>
    <div class="section-label">Reminders<span class="count" id="cnt">·</span></div>
    <div id="rlist"><div class="skeleton"></div></div>`;
  document.getElementById('back').onclick = viewList;
  const enableBtn = document.getElementById('enable');
  if (enableBtn) enableBtn.onclick = async () => {
    enableBtn.disabled = true; enableBtn.textContent = 'Enabling…';
    try { await enableNotifications(); toast('Notifications on'); viewReminders(); }
    catch (e) { enableBtn.disabled = false; enableBtn.textContent = 'Enable notifications'; toast(e.message); }
  };
  document.getElementById('test').onclick = async () => {
    try { const r = await api('/test', { method: 'POST' }); toast(`Test sent (${r.sent}/${r.subscribers})`); }
    catch (e) { toast('Error: ' + e.message); }
  };
  document.getElementById('add').onclick = async () => {
    const text = document.getElementById('rtext').value.trim();
    const whenVal = document.getElementById('rwhen').value;
    if (!text) return toast('Enter a reminder');
    if (!whenVal) return toast('Pick a time');
    const dueAt = new Date(whenVal).getTime();
    const btn = document.getElementById('add'); btn.disabled = true; btn.textContent = 'Adding…';
    try { await api('/reminders', { method: 'POST', body: JSON.stringify({ text, dueAt }) }); toast('Reminder set'); viewReminders(); }
    catch (e) { btn.disabled = false; btn.textContent = 'Add reminder'; toast('Error: ' + e.message); }
  };
  const listEl = document.getElementById('rlist');
  try {
    const { reminders } = await api('/reminders');
    document.getElementById('cnt').textContent = reminders.length;
    if (!reminders.length) { listEl.innerHTML = `<div class="empty">No reminders yet.</div>`; return; }
    listEl.innerHTML = reminders.map(r => {
      const when = new Date(r.dueAt).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      const status = r.sent ? 'sent ✓' : (r.dueAt < Date.now() ? 'due' : 'upcoming');
      return `<div class="note-item" style="cursor:default">
        <span class="glyph">🔔</span>
        <span class="body"><span class="title">${escapeHtml(r.text)}</span>
          <span class="sub">${escapeHtml(when)} · ${status}</span></span>
        <button class="btn danger" data-id="${escapeAttr(r.id)}" style="padding:6px 12px">✕</button>
      </div>`;
    }).join('');
    listEl.querySelectorAll('button[data-id]').forEach(b => b.onclick = async () => {
      try { await api('/reminders?id=' + encodeURIComponent(b.dataset.id), { method: 'DELETE' }); toast('Deleted'); viewReminders(); }
      catch (e) { toast('Error: ' + e.message); }
    });
  } catch (e) {
    listEl.innerHTML = `<div class="empty"><div class="big">⚠️</div>${escapeHtml(e.message)}</div>`;
  }
}

function viewSettings(firstRun) {
  hideFab();
  app.innerHTML = `
    ${firstRun ? '<div class="card-pane" style="margin-bottom:16px;display:flex;gap:12px;align-items:center"><div class="dot" style="width:34px;height:34px;border-radius:10px;flex:0 0 auto;background:linear-gradient(135deg,var(--accent),var(--accent2))"></div><div><b>Welcome to notes</b><div class="muted" style="font-size:13.5px">Paste a GitHub token to connect your notes.</div></div></div>' : ''}
    <div class="field"><label>GitHub token — fine-grained, Contents: read &amp; write</label>
      <input id="token" type="password" placeholder="github_pat_…" value="${escapeAttr(LS.token)}" /></div>
    <div class="field"><label>Owner</label><input id="owner" value="${escapeAttr(LS.owner)}" /></div>
    <div class="field"><label>Repo</label><input id="repo" value="${escapeAttr(LS.repo)}" /></div>
    <div class="field"><label>Branch</label><input id="branch" value="${escapeAttr(LS.branch)}" /></div>
    <div class="section-label" style="margin-left:0">Reminders backend</div>
    <div class="field"><label>Backend URL</label><input id="api" value="${escapeAttr(LS.api)}" placeholder="https://notes-reminders.<you>.workers.dev" /></div>
    <div class="field"><label>Reminders secret</label><input id="apisecret" type="password" value="${escapeAttr(LS.apiSecret)}" placeholder="paste app secret" /></div>
    <div class="row">
      <button class="btn" id="save">Save</button>
      ${firstRun ? '' : '<button class="btn secondary" id="cancel">Cancel</button>'}
    </div>
    <p class="muted" style="margin-top:18px;font-size:13px;line-height:1.6">
      Your token is stored only on this device. Create one at github.com → Settings → Developer settings →
      Fine-grained tokens, with <b>Contents: read &amp; write</b> on the notes repo.</p>`;
  document.getElementById('save').onclick = () => {
    LS.token = document.getElementById('token').value.trim();
    LS.owner = document.getElementById('owner').value.trim();
    LS.repo = document.getElementById('repo').value.trim();
    LS.branch = document.getElementById('branch').value.trim() || 'main';
    LS.api = document.getElementById('api').value.trim();
    LS.apiSecret = document.getElementById('apisecret').value.trim();
    toast('Saved'); viewList();
  };
  const cancel = document.getElementById('cancel');
  if (cancel) cancel.onclick = viewList;
}

function hideFab() { const f = document.querySelector('.fab'); if (f) f.style.display = 'none'; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
const escapeAttr = escapeHtml;

document.getElementById('settingsBtn').onclick = () => viewSettings(false);
document.getElementById('remindersBtn').onclick = () => viewReminders();
document.getElementById('refreshBtn').onclick = () => viewList();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
viewList();
</script>
</body>
</html>
